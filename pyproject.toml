[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "norvara-kmer-counter"
version = "1.0.0rc1"
description = "k-mer spectra, sequence complexity and word composition for nucleotide and protein sequences, from no third-party dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [
    { name = "Norvara Therapeutics", email = "research@norvaratx.com" },
]
maintainers = [
    { name = "Norvara Therapeutics", email = "research@norvaratx.com" },
]
keywords = ["bioinformatics", "k-mer", "sequence-complexity", "entropy", "low-complexity", "composition"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Norvara-Therapeutics/kmer-counter"
Repository = "https://github.com/Norvara-Therapeutics/kmer-counter.git"
Issues = "https://github.com/Norvara-Therapeutics/kmer-counter/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pyflakes>=3"]

[project.scripts]
kmer-counter = "kmer_counter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kmer_counter = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
